<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>할 일</h1>
      <p id="today" class="today"></p>
    </header>

    <section id="progress" class="progress" aria-label="진행률">
      <progress id="progress-bar" value="0" max="100"></progress>
      <p id="progress-text">완료 0 / 전체 0 (0%)</p>
      <ul class="cat-stats">
        <li class="cat-stat" data-category="work">업무 <span id="stat-work">0/0</span></li>
        <li class="cat-stat" data-category="personal">개인 <span id="stat-personal">0/0</span></li>
        <li class="cat-stat" data-category="study">공부 <span id="stat-study">0/0</span></li>
      </ul>
    </section>

    <form id="todo-form" class="todo-form">
      <input id="todo-input" type="text" maxlength="100" placeholder="할 일을 입력하세요" aria-label="할 일 제목" required>
      <select id="todo-category" aria-label="카테고리">
        <option value="work">업무</option>
        <option value="personal">개인</option>
        <option value="study">공부</option>
      </select>
      <button type="submit" id="add-btn">추가</button>
    </form>

    <div class="classify-bar">
      <button type="button" id="auto-classify" aria-pressed="true">자동 재분류 켜짐</button>
      <button type="button" id="classify-settings">분류 설정</button>
    </div>

    <dialog id="classify-dialog" class="classify-dialog" aria-labelledby="classify-title">
      <form id="classify-form" method="dialog">
        <h2 id="classify-title">분류 설정</h2>
        <p class="hint">제목에 아래 키워드가 들어 있으면 그 카테고리를 자동으로 고릅니다. 쉼표나 줄바꿈으로 구분하세요.</p>
        <label for="kw-work">업무</label>
        <textarea id="kw-work" name="kw-work" rows="3"></textarea>
        <label for="kw-personal">개인</label>
        <textarea id="kw-personal" name="kw-personal" rows="3"></textarea>
        <label for="kw-study">공부</label>
        <textarea id="kw-study" name="kw-study" rows="3"></textarea>
        <div class="dialog-actions">
          <button type="button" id="kw-reset">기본값으로</button>
          <button type="submit" value="cancel">취소</button>
          <button type="submit" value="save">저장</button>
        </div>
      </form>
    </dialog>

    <nav id="filters" class="filters" aria-label="필터">
      <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">전체</button>
      <button type="button" class="filter-btn" data-filter="work" aria-pressed="false">업무</button>
      <button type="button" class="filter-btn" data-filter="personal" aria-pressed="false">개인</button>
      <button type="button" class="filter-btn" data-filter="study" aria-pressed="false">공부</button>
    </nav>

    <p id="save-error" class="save-error" role="alert" hidden>저장할 수 없습니다. 새로고침하면 변경 내용이 사라질 수 있습니다.</p>

    <ul id="todo-list" class="todo-list"></ul>

    <footer class="app-footer">
      <button type="button" id="clear-done">완료 항목 비우기</button>
    </footer>
  </main>
</body>
</html>
